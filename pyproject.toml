[project]
name = "reliabilityrag"
version = "0.1.0"
description = "ReliabilityRAG: Effective and Provably Robust Defense for RAG-based Web-Search"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate==1.5.0",
    "litellm>=1.55,<2",  # 1.35.1 pinned upstream is no longer on PyPI; using a recent compatible release
    "nltk==3.8.1",
    "numpy==1.26.2",
    "openai==1.55.3",
    "scikit-learn==1.4.0",
    "spacy>=3.8.6,<3.9",  # 3.8.5 pinned upstream was yanked from PyPI
    "typer<1.0.0",  # required by spacy's own import chain (spacy.cli.download)
    "torch==2.6.0",
    "tqdm==4.66.3",
    "transformers==4.51.0",
    "joblib==1.3.2",
    "matplotlib==3.9.4",
    "fastapi==0.115.0",
    "pandas",
    "sentence-transformers",  # used by src/defense.py; not listed in upstream requirements.txt
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
# GPU-only extras needed for local (non-API) model serving via vLLM.
# Skip these if you only plan to run --model_name gpt-4o-mini / gpt-4o (API-based).
gpu = [
    "vllm==0.8.3",
    "together==1.5.5",
    "flashinfer-python==0.2.2",
]

[tool.uv]
package = false